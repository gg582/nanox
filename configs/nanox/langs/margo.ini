[margo]
extensions = margo,mh
line_comment_tokens = //
block_comment_pairs = /* */
string_delims = ",'
flow = if,else,endif,for,in,while,do,switch,case,default,break,continue,goto,defer,threads,mat_find,mat_for
types = void,int,char,float,double,bool,string,size_t,uint8_t,uint16_t,uint32_t,uint64_t,int8_t,int16_t,int32_t,int64_t,long,short,signed,unsigned,auto,weird,slice,owned,struct,union,enum,type,typedef,auto_matrix,file_pattern,file_pattern_t,bitmask_view,mat_neighbor_cell,neighbor_view
keywords = fn,def,null,true,false,out,print,Scan,ScanLine,alloc,alloc_and_init,owned_new,owned_array,slice_from,slice_make,slice_len,slice_data,slice_at,mat_neighbor,matrix_fill,matrix_identity,matrix_mul,matrix_transpose,matrix_map,matrix_rows,matrix_cols,matrix_get,matrix_set,seek_from_file,pos_from_file,jmp_from_file,return_all_bitmask_offsets,sync,join_all,import,style,set,sizeof,alignof,static,extern,const,inline
preproc_include = include,import
preproc_define = define,undef
preproc_flow = if,ifdef,ifndef,else,elif,endif,pragma,line,error,warning
return_keywords = return
enable_number_highlight = true
enable_bracket_highlight = true

