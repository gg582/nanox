[fortran]
extensions = f,f90,f95,f03,f08,f18,for
line_comment_tokens = !
string_delims = ",'
types = integer,real,double,precision,complex,logical,character,dimension,type,class,procedure
flow = if,then,else,elseif,endif,do,while,concurrent,enddo,select,selectcase,selecttype,selectrank,case,endselect,rank,default,where,elsewhere,endwhere,forall,endforall,associate,endassociate,block,endblock,critical,endcritical,cycle,exit,stop
keywords = program,end,subroutine,function,module,contains,use,call,interface,allocate,deallocate,parameter,implicit,none,data,result,recursive,pure,elemental,intent,in,out,inout,optional,allocatable,pointer,target,save,intrinsic,external,bind,abstract,extends,public,private,protected,value,volatile,asynchronous,contiguous,import
return_keywords = return
